<text x="834" y="838" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#F3F3F1" font-weight="650">Team MCP vs personal</text>
<text x="806" y="858" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#D4D2CE">· .mcp.json + ${ENV} shared on clone</text>
