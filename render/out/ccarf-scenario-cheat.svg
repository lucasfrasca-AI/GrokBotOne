<text x="50" y="545" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#A855F7" font-weight="700">01</text>
<text x="78" y="545" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#F3F3F1" font-weight="650">Hooks</text>
<text x="50" y="565" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#D4D2CE">· PreToolUse blocks refunds / rm -rf</text>
<text x="50" y="585" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#D4D2CE">· PostToolUse cannot un-delete</text>
<text x="50" y="605" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#D4D2CE">· PreCompact before /compact (archive)</text>
<text x="50" y="625" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#D4D2CE">· No Compact tool for PreToolUse</text>
<rect x="48" y="770" width="110" height="30" rx="7" fill="rgba(168,85,247,.18)"/><text x="60" y="790" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#A855F7" font-weight="500">Pre=block</text>
<rect x="166" y="770" width="120" height="30" rx="7" fill="#1B122B"/><text x="178" y="790" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#A4A098" font-weight="500">Post=after</text>
<rect x="414" y="523" width="370" height="285" rx="11" fill="#160F24" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
<rect x="414" y="523" width="4" height="285" rx="2" fill="#A855F7"/>
<text x="428" y="545" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#A855F7" font-weight="700">02</text>
<text x="456" y="545" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#F3F3F1" font-weight="650">tool_choice</text>
<text x="428" y="565" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#D4D2CE">· auto: text or tool (default)</text>
<text x="428" y="585" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#D4D2CE">· any: must call some tool</text>
<text x="428" y="605" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#D4D2CE">· forced name for mandatory first step</text>
<text x="428" y="625" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#D4D2CE">· none: no tools this turn</text>
<rect x="426" y="770" width="62" height="30" rx="7" fill="rgba(99,102,241,.18)"/><text x="438" y="790" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#6366F1" font-weight="500">auto</text>
<rect x="496" y="770" width="54" height="30" rx="7" fill="rgba(168,85,247,.18)"/><text x="508" y="790" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#A855F7" font-weight="500">any</text>
<rect x="558" y="770" width="81" height="30" rx="7" fill="rgba(252,211,77,.15)"/><text x="570" y="790" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#FCD34D" font-weight="500">forced</text>
<rect x="792" y="523" width="370" height="285" rx="11" fill="#160F24" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
<rect x="792" y="523" width="4" height="285" rx="2" fill="#A855F7"/>
<text x="806" y="545" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#A855F7" font-weight="700">03</text>
<text x="834" y="545" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#F3F3F1" font-weight="650">stop_reason</text>
<text x="806" y="565" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#D4D2CE">· Continue on tool_use</text>
<text x="806" y="585" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#D4D2CE">· Stop on end_turn</text>
<text x="806" y="605" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#D4D2CE">· Also: max_tokens / pause_turn / refusal</text>
<text x="806" y="625" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#D4D2CE">· Never parse prose to exit loop</text>
<rect x="804" y="770" width="100" height="30" rx="7" fill="rgba(168,85,247,.18)"/><text x="816" y="790" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#A855F7" font-weight="500">tool_use</text>
