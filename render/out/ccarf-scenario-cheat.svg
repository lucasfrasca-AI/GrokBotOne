<text x="456" y="838" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#F3F3F1" font-weight="650">Grep / Glob + CI</text>
<text x="428" y="858" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#D4D2CE">· Grep = file contents</text>
<text x="428" y="878" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#D4D2CE">· Glob = path patterns</text>
<text x="428" y="898" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#D4D2CE">· CI hang -&gt; -p / --print</text>
<text x="428" y="918" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#D4D2CE">· Reject CLAUDE_HEADLESS / --batch</text>
