<rect x="36" y="816" width="4" height="285" rx="2" fill="#A855F7"/>
<text x="50" y="842" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A855F7" font-weight="700">04</text>
<text x="80" y="842" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#F3F3F1" font-weight="650">Batches vs sync</text>
<text x="50" y="872" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· Batches: no multi-turn tool loops</text>
<text x="50" y="896" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· custom_id to resubmit failed rows</text>
<text x="50" y="920" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· Blocking / pre-merge -&gt; sync Messages</text>
<text x="50" y="944" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· ~50% cheaper; up to 24h; no SLA</text>
<text x="50" y="968" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· Latency-tolerant jobs only for batches</text>
<rect x="46" y="1023" width="91" height="30" rx="7" fill="rgba(252,211,77,.15)"/><text x="58" y="1043" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#FCD34D" font-weight="500">batches</text>
<rect x="145" y="1023" width="110" height="30" rx="7" fill="#1B122B"/><text x="157" y="1043" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#A4A098" font-weight="500">custom_id</text>
<rect x="263" y="1023" width="62" height="30" rx="7" fill="rgba(168,85,247,.18)"/><text x="275" y="1043" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#A855F7" font-weight="500">sync</text>
<rect x="414" y="816" width="370" height="285" rx="11" fill="#160F24" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
<rect x="414" y="816" width="4" height="285" rx="2" fill="#A855F7"/>
<text x="428" y="842" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A855F7" font-weight="700">05</text>
<text x="458" y="842" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#F3F3F1" font-weight="650">Grep / Glob + CI</text>
<text x="428" y="872" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· Grep searches file contents</text>
<text x="428" y="896" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· Glob matches path patterns only</text>
<text x="428" y="920" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· Explore: Grep -&gt; Read matches</text>
<text x="428" y="944" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· CI hang -&gt; -p / --print non-interactive</text>
<text x="428" y="968" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· Reject CLAUDE_HEADLESS / --batch flags</text>
