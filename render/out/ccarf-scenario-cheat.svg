<text x="836" y="842" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#F3F3F1" font-weight="650">Team MCP vs personal</text>
<text x="806" y="872" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· .mcp.json + ${ENV} shared on clone</text>
<text x="806" y="896" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· ~/.claude.json personal / experimental</text>
<text x="806" y="920" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· Secrets only via ${ENV_VAR} refs</text>
