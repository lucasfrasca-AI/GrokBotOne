<text x="50" y="549" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A855F7" font-weight="700">01</text>
<text x="80" y="549" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#F3F3F1" font-weight="650">Hooks</text>
<text x="50" y="579" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· PreToolUse can block before the tool runs</text>
<text x="50" y="603" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· Use Pre for refunds, rm -rf, money moves</text>
<text x="50" y="627" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· PostToolUse fires after; cannot un-delete</text>
<text x="50" y="651" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· PreCompact runs before /compact archive</text>
<text x="50" y="675" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· No Compact tool target for PreToolUse</text>
<rect x="46" y="730" width="110" height="30" rx="7" fill="rgba(168,85,247,.18)"/><text x="58" y="750" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#A855F7" font-weight="500">Pre=block</text>
<rect x="164" y="730" width="120" height="30" rx="7" fill="#1B122B"/><text x="176" y="750" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#A4A098" font-weight="500">Post=after</text>
<rect x="46" y="766" width="120" height="30" rx="7" fill="rgba(99,102,241,.18)"/><text x="58" y="786" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#6366F1" font-weight="500">PreCompact</text>
<rect x="414" y="523" width="370" height="285" rx="11" fill="#160F24" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
<rect x="414" y="523" width="4" height="285" rx="2" fill="#A855F7"/>
<text x="428" y="549" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A855F7" font-weight="700">02</text>
<text x="458" y="549" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#F3F3F1" font-weight="650">tool_choice</text>
<text x="428" y="579" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· auto: model may text or call a tool</text>
<text x="428" y="603" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· any: must call some tool this turn</text>
<text x="428" y="627" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· forced name for mandatory first step</text>
<text x="428" y="651" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· none: no tools allowed this turn</text>
<text x="428" y="675" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· Force named tool, then switch to auto</text>
<rect x="424" y="730" width="62" height="30" rx="7" fill="rgba(99,102,241,.18)"/><text x="436" y="750" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#6366F1" font-weight="500">auto</text>
<rect x="494" y="730" width="52" height="30" rx="7" fill="rgba(168,85,247,.18)"/><text x="506" y="750" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#A855F7" font-weight="500">any</text>
<rect x="554" y="730" width="81" height="30" rx="7" fill="rgba(252,211,77,.15)"/><text x="566" y="750" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#FCD34D" font-weight="500">forced</text>
<rect x="792" y="523" width="370" height="285" rx="11" fill="#160F24" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
<rect x="792" y="523" width="4" height="285" rx="2" fill="#A855F7"/>
<text x="806" y="549" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A855F7" font-weight="700">03</text>
<text x="836" y="549" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#F3F3F1" font-weight="650">stop_reason</text>
<text x="806" y="579" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· Continue the loop on tool_use</text>
<text x="806" y="603" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· Stop cleanly on end_turn</text>
<text x="806" y="627" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· Also: max_tokens / pause_turn / refusal</text>
<text x="806" y="651" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· Append tool results, then call again</text>
<text x="806" y="675" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">· Never parse assistant prose to exit</text>
<rect x="802" y="730" width="100" height="30" rx="7" fill="rgba(168,85,247,.18)"/><text x="814" y="750" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#A855F7" font-weight="500">tool_use</text>
<rect x="910" y="730" width="100" height="30" rx="7" fill="rgba(99,102,241,.18)"/><text x="922" y="750" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#6366F1" font-weight="500">end_turn</text>
<rect x="1018" y="730" width="62" height="30" rx="7" fill="#1B122B"/><text x="1030" y="750" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#A4A098" font-weight="500">loop</text>
