<text x="78" y="838" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#F3F3F1" font-weight="650">Batches vs sync</text>
<text x="50" y="858" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#D4D2CE">· No multi-turn tools in a batch</text>
<text x="50" y="878" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#D4D2CE">· custom_id to resubmit failures</text>
<text x="50" y="898" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#D4D2CE">· Blocking / pre-merge -&gt; sync API</text>
<text x="50" y="918" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#D4D2CE">· ~50% cheaper, up to 24h, no SLA</text>
