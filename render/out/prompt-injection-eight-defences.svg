<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <!-- ONE spectrum gradient only — title underline -->
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="#05010E"/>

  <!-- Title band (compact) -->
  <text x="30" y="34" text-anchor="start"
        font-family="General Sans, ui-sans-serif, system-ui, sans-serif"
        font-size="32" font-weight="600" fill="#F3F3F1">Eight defences against prompt injection</text>
  <rect x="30" y="44" width="500" height="3" rx="1.5" fill="url(#spectrum)"/>

  <!-- Lead strip — stand-behindable subtitle -->
  <rect x="30" y="54" width="920" height="26" rx="6" fill="#1C1528"/>
  <text x="44" y="72"
        font-family="Geist, ui-sans-serif, system-ui, sans-serif"
        font-size="15" fill="#A4A098">Eight defensive measures available in the SecDim wargame.</text>

  <!-- Roman mark top-RIGHT -->
  <image href="marks/cseccon-v-roman-figure.png" x="1078" y="4" width="100" height="76"
         preserveAspectRatio="xMidYMid meet"/>
  <text x="1078" y="90"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13" font-weight="600" letter-spacing="0.06em" fill="#F3F3F1">CSECCON</text>
  <text x="1166" y="90"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="16" font-weight="700" fill="#FCD34D">V</text>

  <!-- 01. Output filtering -->
  <g>
    <rect x="30" y="96" width="562" height="239" rx="12"
          fill="#160F24" stroke="rgba(243,243,241,.12)" stroke-width="1.5"/>
    <text x="50" y="132"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="17" font-weight="500" fill="#A855F7">01</text>
    <text x="96" y="132"
          font-family="Geist, ui-sans-serif, system-ui, sans-serif"
          font-size="22" font-weight="600" fill="#F3F3F1">Output filtering</text>
    <rect x="50" y="148" width="522" height="2" fill="#A855F7"/>
    <text x="50" y="196"
          font-family="Geist, ui-sans-serif, system-ui, sans-serif"
          font-size="19" fill="#D4D2CE">Scrutinise the reply before it leaves the model.</text>
    <rect x="50" y="244" width="152" height="38" rx="6"
          fill="#1C1528" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
    <text x="126.0" y="269"
          text-anchor="middle"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="16" fill="#D4D2CE">keyword match</text>
    <rect x="212" y="244" width="172" height="38" rx="6"
          fill="#1C1528" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
    <text x="298.0" y="269"
          text-anchor="middle"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="16" fill="#D4D2CE">string-distance</text>
    <rect x="394" y="244" width="114" height="38" rx="6"
          fill="#1C1528" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
    <text x="451.0" y="269"
          text-anchor="middle"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="16" fill="#D4D2CE">reversals</text>
    <rect x="50" y="299" width="8" height="8" rx="1" fill="#FCD34D"/>
    <text x="66" y="309"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="15" font-weight="500" fill="#FCD34D">If missing</text>
    <text x="177" y="309"
          font-family="Geist, ui-sans-serif, system-ui, sans-serif"
          font-size="16" fill="#A4A098">Near-miss spellings walk out clean.</text>
  </g>
  <!-- 02. Whitelist / blacklist -->
  <g>
    <rect x="608" y="96" width="562" height="239" rx="12"
          fill="#160F24" stroke="rgba(243,243,241,.12)" stroke-width="1.5"/>
    <text x="628" y="132"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="17" font-weight="500" fill="#A855F7">02</text>
    <text x="674" y="132"
          font-family="Geist, ui-sans-serif, system-ui, sans-serif"
          font-size="22" font-weight="600" fill="#F3F3F1">Whitelist / blacklist</text>
    <rect x="628" y="148" width="522" height="2" fill="#A855F7"/>
    <text x="628" y="196"
          font-family="Geist, ui-sans-serif, system-ui, sans-serif"
          font-size="19" fill="#D4D2CE">Closed scenario set only (maths, temperature, translation).</text>
    <rect x="628" y="244" width="181" height="38" rx="6"
          fill="#1C1528" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
    <text x="718.5" y="269"
          text-anchor="middle"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="16" fill="#D4D2CE">closed scenarios</text>
    <rect x="819" y="244" width="172" height="38" rx="6"
          fill="#1C1528" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
    <text x="905.0" y="269"
          text-anchor="middle"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="16" fill="#D4D2CE">ignore / banana</text>
    <rect x="628" y="299" width="8" height="8" rx="1" fill="#FCD34D"/>
    <text x="644" y="309"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="15" font-weight="500" fill="#FCD34D">If missing</text>
    <text x="755" y="309"
          font-family="Geist, ui-sans-serif, system-ui, sans-serif"
          font-size="16" fill="#A4A098">Attacker text looks like in-scope work.</text>
  </g>
  <!-- 03. Stop sequences -->
  <g>
    <rect x="30" y="347" width="562" height="239" rx="12"
          fill="#160F24" stroke="rgba(243,243,241,.12)" stroke-width="1.5"/>
    <text x="50" y="383"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="17" font-weight="500" fill="#A855F7">03</text>
    <text x="96" y="383"
          font-family="Geist, ui-sans-serif, system-ui, sans-serif"
          font-size="22" font-weight="600" fill="#F3F3F1">Stop sequences</text>
    <rect x="50" y="399" width="522" height="2" fill="#A855F7"/>
    <text x="50" y="447"
          font-family="Geist, ui-sans-serif, system-ui, sans-serif"
          font-size="19" fill="#D4D2CE">API stop list cuts generation the instant a leak appears.</text>
    <rect x="50" y="495" width="152" height="38" rx="6"
          fill="#1C1528" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
    <text x="126.0" y="520"
          text-anchor="middle"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="16" fill="#D4D2CE">API stop list</text>
    <rect x="212" y="495" width="162" height="38" rx="6"
          fill="#1C1528" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
    <text x="293.0" y="520"
          text-anchor="middle"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="16" fill="#D4D2CE">mid-stream cut</text>
    <rect x="50" y="550" width="8" height="8" rx="1" fill="#FCD34D"/>
    <text x="66" y="560"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="15" font-weight="500" fill="#FCD34D">If missing</text>
    <text x="177" y="560"
          font-family="Geist, ui-sans-serif, system-ui, sans-serif"
          font-size="16" fill="#A4A098">Tokens keep flowing past a partial escape.</text>
  </g>
  <!-- 04. Red herring -->
  <g>
    <rect x="608" y="347" width="562" height="239" rx="12"
          fill="#160F24" stroke="rgba(243,243,241,.12)" stroke-width="1.5"/>
    <text x="628" y="383"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="17" font-weight="500" fill="#A855F7">04</text>
    <text x="674" y="383"
          font-family="Geist, ui-sans-serif, system-ui, sans-serif"
          font-size="22" font-weight="600" fill="#F3F3F1">Red herring</text>
    <rect x="628" y="399" width="522" height="2" fill="#A855F7"/>
    <text x="628" y="447"
          font-family="Geist, ui-sans-serif, system-ui, sans-serif"
          font-size="19" fill="#D4D2CE">Plant decoy UUID-style secrets in the system prompt.</text>
    <rect x="628" y="495" width="152" height="38" rx="6"
          fill="#1C1528" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
    <text x="704.0" y="520"
          text-anchor="middle"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="16" fill="#D4D2CE">decoy secrets</text>
    <rect x="790" y="495" width="114" height="38" rx="6"
          fill="#1C1528" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
    <text x="847.0" y="520"
          text-anchor="middle"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="16" fill="#D4D2CE">fake UUID</text>
    <rect x="628" y="550" width="8" height="8" rx="1" fill="#FCD34D"/>
    <text x="644" y="560"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="15" font-weight="500" fill="#FCD34D">If missing</text>
    <text x="755" y="560"
          font-family="Geist, ui-sans-serif, system-ui, sans-serif"
          font-size="16" fill="#A4A098">Extraction returns the real secret.</text>
  </g>
  <!-- 05. Intrusion defence -->
  <g>
    <rect x="30" y="598" width="562" height="239" rx="12"
          fill="#160F24" stroke="rgba(243,243,241,.12)" stroke-width="1.5"/>
    <text x="50" y="634"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="17" font-weight="500" fill="#A855F7">05</text>
    <text x="96" y="634"
          font-family="Geist, ui-sans-serif, system-ui, sans-serif"
          font-size="22" font-weight="600" fill="#F3F3F1">Intrusion defence</text>
    <rect x="50" y="650" width="522" height="2" fill="#A855F7"/>
    <text x="50" y="698"
          font-family="Geist, ui-sans-serif, system-ui, sans-serif"
          font-size="19" fill="#D4D2CE">Hostile frame keeps the model vigilant against user tricks.</text>
    <rect x="50" y="746" width="152" height="38" rx="6"
          fill="#1C1528" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
    <text x="126.0" y="771"
          text-anchor="middle"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="16" fill="#D4D2CE">hostile frame</text>
    <rect x="212" y="746" width="114" height="38" rx="6"
          fill="#1C1528" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
    <text x="269.0" y="771"
          text-anchor="middle"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="16" fill="#D4D2CE">preferred</text>
    <rect x="50" y="801" width="8" height="8" rx="1" fill="#FCD34D"/>
    <text x="66" y="811"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="15" font-weight="500" fill="#FCD34D">If missing</text>
    <text x="177" y="811"
          font-family="Geist, ui-sans-serif, system-ui, sans-serif"
          font-size="16" fill="#A4A098">Model treats untrusted turns as cooperative.</text>
  </g>
  <!-- 06. Response tagging -->
  <g>
    <rect x="608" y="598" width="562" height="239" rx="12"
          fill="#160F24" stroke="rgba(243,243,241,.12)" stroke-width="1.5"/>
    <text x="628" y="634"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="17" font-weight="500" fill="#A855F7">06</text>
    <text x="674" y="634"
          font-family="Geist, ui-sans-serif, system-ui, sans-serif"
          font-size="22" font-weight="600" fill="#F3F3F1">Response tagging</text>
    <rect x="628" y="650" width="522" height="2" fill="#A855F7"/>
    <text x="628" y="698"
          font-family="Geist, ui-sans-serif, system-ui, sans-serif"
          font-size="19" fill="#D4D2CE">Wrap user input in fixed or random open/close tags.</text>
    <rect x="628" y="746" width="124" height="38" rx="6"
          fill="#1C1528" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
    <text x="690.0" y="771"
          text-anchor="middle"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="16" fill="#D4D2CE">fixed tags</text>
    <rect x="762" y="746" width="133" height="38" rx="6"
          fill="#1C1528" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
    <text x="828.5" y="771"
          text-anchor="middle"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="16" fill="#D4D2CE">random tags</text>
    <rect x="628" y="801" width="8" height="8" rx="1" fill="#FCD34D"/>
    <text x="644" y="811"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="15" font-weight="500" fill="#FCD34D">If missing</text>
    <text x="755" y="811"
          font-family="Geist, ui-sans-serif, system-ui, sans-serif"
          font-size="16" fill="#A4A098">Attacker text can end the system block.</text>
  </g>
  <!-- 07. LLM reevaluation -->
  <g>
    <rect x="30" y="849" width="562" height="239" rx="12"
          fill="#160F24" stroke="rgba(243,243,241,.12)" stroke-width="1.5"/>
    <text x="50" y="885"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="17" font-weight="500" fill="#A855F7">07</text>
    <text x="96" y="885"
          font-family="Geist, ui-sans-serif, system-ui, sans-serif"
          font-size="22" font-weight="600" fill="#F3F3F1">LLM reevaluation</text>
    <rect x="50" y="901" width="522" height="2" fill="#A855F7"/>
    <text x="50" y="949"
          font-family="Geist, ui-sans-serif, system-ui, sans-serif"
          font-size="19" fill="#D4D2CE">Second API call re-checks output before the user sees it.</text>
    <rect x="50" y="997" width="143" height="38" rx="6"
          fill="#1C1528" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
    <text x="121.5" y="1022"
          text-anchor="middle"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="16" fill="#D4D2CE">2nd API call</text>
    <rect x="203" y="997" width="104" height="38" rx="6"
          fill="#1C1528" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
    <text x="255.0" y="1022"
          text-anchor="middle"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="16" fill="#D4D2CE">guardian</text>
    <rect x="50" y="1052" width="8" height="8" rx="1" fill="#FCD34D"/>
    <text x="66" y="1062"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="15" font-weight="500" fill="#FCD34D">If missing</text>
    <text x="177" y="1062"
          font-family="Geist, ui-sans-serif, system-ui, sans-serif"
          font-size="16" fill="#A4A098">Compromised generation reaches the client unchecked.</text>
  </g>
  <!-- 08. Sandwich defence -->
  <g>
    <rect x="608" y="849" width="562" height="239" rx="12"
          fill="#160F24" stroke="rgba(243,243,241,.12)" stroke-width="1.5"/>
    <text x="628" y="885"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="17" font-weight="500" fill="#A855F7">08</text>
    <text x="674" y="885"
          font-family="Geist, ui-sans-serif, system-ui, sans-serif"
          font-size="22" font-weight="600" fill="#F3F3F1">Sandwich defence</text>
    <rect x="628" y="901" width="522" height="2" fill="#A855F7"/>
    <text x="628" y="949"
          font-family="Geist, ui-sans-serif, system-ui, sans-serif"
          font-size="19" fill="#D4D2CE">System instructions before and after the user turn.</text>
    <rect x="628" y="997" width="162" height="38" rx="6"
          fill="#1C1528" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
    <text x="709.0" y="1022"
          text-anchor="middle"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="16" fill="#D4D2CE">before + after</text>
    <rect x="800" y="997" width="152" height="38" rx="6"
          fill="#1C1528" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
    <text x="876.0" y="1022"
          text-anchor="middle"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="16" fill="#D4D2CE">self-reminder</text>
    <rect x="628" y="1052" width="8" height="8" rx="1" fill="#FCD34D"/>
    <text x="644" y="1062"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="15" font-weight="500" fill="#FCD34D">If missing</text>
    <text x="755" y="1062"
          font-family="Geist, ui-sans-serif, system-ui, sans-serif"
          font-size="16" fill="#A4A098">Post-user drift sticks; model follows the injection.</text>
  </g>
  <!-- LF mark bottom-LEFT: 72×72 at x=36 y=1092 -->
  <image href="marks/lf-mark.png" x="36" y="1092" width="72" height="72"
         preserveAspectRatio="xMidYMid meet"/>
</svg>
