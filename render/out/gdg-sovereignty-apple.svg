<line x1="375.2" y1="359.5" x2="375.2" y2="378.0" stroke="rgba(243,243,241,.3)" stroke-width="1"/>
<rect x="272.8" y="378.0" width="204.8" height="252.0" rx="28" fill="#05010E" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
<text x="296.8" y="428.0" font-family="General Sans, Geist, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="600" fill="#F3F3F1" letter-spacing="-0.6">Data</text>
<text x="296.8" y="460.0" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="400" fill="#D4D2CE">where it is stored</text>
<text x="296.8" y="483.0" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="400" fill="#D4D2CE">and processed</text>
<text x="296.8" y="578.0" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#A4A098" letter-spacing="1.0">MOSTLY</text>
<text x="296.8" y="600.0" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#A4A098" letter-spacing="1.0">LOCALISATION</text>
<path d="M 484.6 524 L 490.6 530 L 484.6 536" fill="none" stroke="#A4A098" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="600.0" y1="359.5" x2="600.0" y2="378.0" stroke="#A855F7" stroke-width="2"/>
<rect x="497.6" y="378.0" width="204.8" height="252.0" rx="28" fill="#160F24" stroke="#A855F7" stroke-width="1.5"/>
<text x="521.6" y="428.0" font-family="General Sans, Geist, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700" fill="#A855F7" letter-spacing="-0.6">Policy</text>
<text x="521.6" y="460.0" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="400" fill="#F3F3F1">who sets and</text>
<text x="521.6" y="483.0" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="400" fill="#F3F3F1">enforces the rules</text>
<text x="521.6" y="578.0" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#A855F7" letter-spacing="1.0">TRUE</text>
<text x="521.6" y="600.0" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#A855F7" letter-spacing="1.0">SOVEREIGNTY</text>
<path d="M 715.4 524 L 709.4 530 L 715.4 536" fill="none" stroke="#A4A098" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="824.8" y1="359.5" x2="824.8" y2="378.0" stroke="rgba(243,243,241,.3)" stroke-width="1"/>
<rect x="722.4" y="378.0" width="204.8" height="252.0" rx="28" fill="#05010E" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
<text x="746.4" y="428.0" font-family="General Sans, Geist, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="600" fill="#F3F3F1" letter-spacing="-0.6">Inference</text>
<text x="746.4" y="460.0" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="400" fill="#D4D2CE">where the model</text>
<text x="746.4" y="483.0" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="400" fill="#D4D2CE">runs</text>
<text x="746.4" y="578.0" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#A4A098" letter-spacing="1.0">MOSTLY</text>
<text x="746.4" y="600.0" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#A4A098" letter-spacing="1.0">LOCALISATION</text>
