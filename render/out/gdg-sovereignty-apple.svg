<rect x="947.2" y="378.0" width="204.8" height="252.0" rx="28" fill="#05010E" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
<text x="971.2" y="428.0" font-family="General Sans, Geist, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="600" fill="#F3F3F1" letter-spacing="-0.6">Intellectual</text>
<text x="971.2" y="460.0" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="400" fill="#D4D2CE">domain know-how</text>
<text x="971.2" y="483.0" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="400" fill="#D4D2CE">that can&apos;t be</text>
<text x="971.2" y="506.0" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="400" fill="#D4D2CE">scraped</text>
<text x="971.2" y="578.0" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#F3F3F1" letter-spacing="1.0">ADDED</text>
<text x="971.2" y="600.0" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#F3F3F1" letter-spacing="1.0">5TH LEG</text>
<path d="M 50.0 643 V 650 H 925.2 V 643" fill="none" stroke="rgba(243,243,241,.3)" stroke-width="1"/>
<path d="M 949.2 643 V 650 H 1150.0 V 643" fill="none" stroke="rgba(243,243,241,.3)" stroke-width="1"/>
<text x="487.6" y="678.0" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="500" fill="#D4D2CE" text-anchor="middle">Four legs proposed by David Brudenell, Decidr</text>
<text x="1049.6" y="678.0" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="500" fill="#D4D2CE" text-anchor="middle">Added by Raymond Sun</text>
<text x="487.6" y="704.0" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="400" fill="#A4A098" font-style="italic" text-anchor="middle">Raymond Sun: data, compute and inference are mostly localisation; true sovereignty is policy</text>
<line x1="48.0" y1="738.0" x2="1152.0" y2="738.0" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
<text x="48.0" y="778.0" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="500" fill="#A4A098" letter-spacing="1.4">THE RULE OF THREE  ·  RAMESH HEIDARY, GOOGLE CLOUD</text>
<text x="45.0" y="874.0"><tspan font-family="General Sans, Geist, ui-sans-serif, system-ui, sans-serif" font-size="84" font-weight="300" letter-spacing="-3.4" fill="#F3F3F1">1</tspan></text>
<text x="114.0" y="836.0" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" fill="#F3F3F1">Know where your data goes</text>
<text x="114.0" y="862.0" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="400" fill="#D4D2CE">prompts and metadata included</text>
<text x="426.3" y="874.0"><tspan font-family="General Sans, Geist, ui-sans-serif, system-ui, sans-serif" font-size="84" font-weight="300" letter-spacing="-3.4" fill="#F3F3F1">2</tspan></text>
<text x="495.3" y="836.0" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" fill="#F3F3F1">Know who can be legally</text>
<text x="495.3" y="862.0" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="400" fill="#D4D2CE">compelled to hand it over</text>
<text x="807.7" y="874.0"><tspan font-family="General Sans, Geist, ui-sans-serif, system-ui, sans-serif" font-size="84" font-weight="300" letter-spacing="-3.4" fill="#F3F3F1">3</tspan></text>
<text x="876.7" y="836.0" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" fill="#F3F3F1">Be able to prove it</text>
<line x1="48.0" y1="898.0" x2="1152.0" y2="898.0" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
<text x="48.0" y="938.0" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="500" fill="#A4A098" letter-spacing="1.4">WHERE AUSTRALIA SITS  ·  LAURA HEIDRICH, GOOGLE CLOUD</text>
<line x1="48.0" y1="1016.0" x2="1152.0" y2="1016.0" stroke="rgba(243,243,241,.35)" stroke-width="1.5"/>
<text x="192.0" y="998.0" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="500" fill="#A4A098" letter-spacing="1.4">STRICTER RULES</text>
<text x="1008.0" y="998.0" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="500" fill="#A4A098" letter-spacing="1.4" text-anchor="end">LOOSER RULES</text>
