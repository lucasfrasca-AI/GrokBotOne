<text x="600.0" y="998.0" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" fill="#A855F7" text-anchor="middle">AU</text>
<circle cx="1042.0" cy="1016.0" r="6" fill="#F3F3F1"/>
<text x="1042.0" y="998.0" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" fill="#F3F3F1" text-anchor="middle">US</text>
<text x="158.0" y="1060.0" font-family="General Sans, Geist, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#D4D2CE" font-style="italic" text-anchor="middle">“A hygiene factor”</text>
<text x="600.0" y="1060.0" font-family="General Sans, Geist, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#F3F3F1" font-style="italic" text-anchor="middle">“The ethical middle ground”</text>
<text x="1042.0" y="1060.0" font-family="General Sans, Geist, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#D4D2CE" font-style="italic" text-anchor="middle">“The Wild West”</text>
