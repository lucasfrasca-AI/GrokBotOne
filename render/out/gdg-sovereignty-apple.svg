<text x="48.0" y="70.0" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#A855F7" letter-spacing="1.6">SPARK FESTIVAL  ·  SOVEREIGN AI PANEL  ·  SYDNEY</text>
<text x="48.0" y="120.0" font-family="General Sans, Geist, ui-sans-serif, system-ui, sans-serif" font-size="46" font-weight="600" fill="#F3F3F1" letter-spacing="-1.2">AI sovereignty is leverage</text>
<text x="48.0" y="152.0" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="400" fill="#A4A098">Five legs, three tests and one middle ground, from the panel</text>
<text x="44.0" y="244.0" font-family="General Sans, Geist, ui-sans-serif, system-ui, sans-serif" font-size="66" font-weight="600" fill="#F3F3F1" letter-spacing="-2.2">“Sovereignty = leverage,</text>
<text x="70.0" y="318.0" font-family="General Sans, Geist, ui-sans-serif, system-ui, sans-serif" font-size="66" font-weight="600" fill="#F3F3F1" letter-spacing="-2.2">not just choice”</text>
<text x="1152.0" y="318.0" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="500" fill="#A4A098" text-anchor="end">Raymond Sun, HSF Kramer</text>
<rect x="48.0" y="356.5" width="1104.0" height="3.0" rx="1.5" fill="#F3F3F1"/>
<line x1="150.4" y1="359.5" x2="150.4" y2="378.0" stroke="rgba(243,243,241,.3)" stroke-width="1"/>
<rect x="48.0" y="378.0" width="204.8" height="252.0" rx="28" fill="#05010E" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
<text x="72.0" y="428.0" font-family="General Sans, Geist, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="600" fill="#F3F3F1" letter-spacing="-0.6">Model</text>
<text x="72.0" y="460.0" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="400" fill="#D4D2CE">who builds it, and</text>
<text x="72.0" y="483.0" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="400" fill="#D4D2CE">whose values it</text>
<text x="72.0" y="506.0" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="400" fill="#D4D2CE">carries</text>
