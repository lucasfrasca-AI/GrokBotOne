<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#05010E"/>

  
  <defs>
    <linearGradient id="specTerms" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
  </defs>
  <rect x="48" y="36" width="240" height="4" rx="2.0" fill="url(#specTerms)"/>
  <text x="48" y="72" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#A855F7"
        letter-spacing="1.6" font-weight="600">CCAR-F  ·  MEMORISE</text>
  <text x="48" y="116" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="40" fill="#F3F3F1"
        font-weight="700">Terms Hit-List</text>
  <text x="48" y="148" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#D4D2CE">Paths, flags, and API params until reflexive</text>

<rect x="36" y="168" width="619" height="198" rx="14" fill="#160F24" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
<text x="52" y="196" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#A855F7" font-weight="600">01</text>
<text x="52" y="228" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="24" fill="#F3F3F1" font-weight="650">stop_reason</text>
<text x="52" y="267" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#D4D2CE">Continue on tool_use; stop on end_turn.</text>
<rect x="52" y="281" width="120" height="30" rx="7" fill="#1B122B"/><text x="64" y="301" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#A4A098" font-weight="500">max_tokens</text>
<rect x="180" y="281" width="120" height="30" rx="7" fill="#1B122B"/><text x="192" y="301" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#A4A098" font-weight="500">pause_turn</text>
<rect x="308" y="281" width="91" height="30" rx="7" fill="#1B122B"/><text x="320" y="301" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#A4A098" font-weight="500">refusal</text>
<text x="52" y="352" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#FCD34D">Never end the loop by parsing assistant prose.</text>
<rect x="677" y="174" width="487" height="198" rx="14" fill="#160F24" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
<text x="693" y="201" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#A855F7" font-weight="600">02</text>
<text x="693" y="231" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#F3F3F1" font-weight="650">tool_choice</text>
<text x="693" y="266" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">auto / any / tool+name / none.</text>
<rect x="693" y="278" width="55" height="26" rx="6" fill="rgba(99,102,241,.18)"/><text x="704" y="296" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#6366F1" font-weight="500">auto</text>
<rect x="755" y="278" width="47" height="26" rx="6" fill="rgba(168,85,247,.18)"/><text x="766" y="296" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#A855F7" font-weight="500">any</text>
<rect x="809" y="278" width="72" height="26" rx="6" fill="rgba(252,211,77,.15)"/><text x="820" y="296" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#FCD34D" font-weight="500">forced</text>
<text x="693" y="342" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#FCD34D">Force named tool for mandatory first step,</text>
<text x="693" y="358" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#FCD34D">then auto.</text>
<rect x="36" y="388" width="486" height="250" rx="14" fill="#160F24" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
<text x="52" y="416" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#A855F7" font-weight="600">03</text>
<text x="52" y="448" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="24" fill="#F3F3F1" font-weight="650">Hooks</text>
<text x="52" y="487" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#D4D2CE">PreToolUse can block; PostToolUse</text>
<text x="52" y="508" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#D4D2CE">after; PreCompact before compact.</text>
<rect x="52" y="522" width="120" height="30" rx="7" fill="rgba(168,85,247,.18)"/><text x="64" y="542" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#A855F7" font-weight="500">PreToolUse</text>
<rect x="180" y="522" width="129" height="30" rx="7" fill="#1B122B"/><text x="192" y="542" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#A4A098" font-weight="500">PostToolUse</text>
<rect x="317" y="522" width="120" height="30" rx="7" fill="#1B122B"/><text x="329" y="542" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#A4A098" font-weight="500">PreCompact</text>
<text x="52" y="606" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#FCD34D">Money / irreversible -&gt; PreToolUse gate,</text>
<text x="52" y="624" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#FCD34D">not a stronger prompt.</text>
<rect x="544" y="384" width="620" height="250" rx="14" fill="#160F24" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
<text x="560" y="412" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#A855F7" font-weight="600">04</text>
<text x="560" y="444" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="24" fill="#F3F3F1" font-weight="650">MCP paths</text>
<text x="560" y="483" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#D4D2CE">Team .mcp.json + ${ENV}; personal</text>
<text x="560" y="504" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#D4D2CE">~/.claude.json.</text>
<rect x="560" y="518" width="110" height="30" rx="7" fill="rgba(99,102,241,.18)"/><text x="572" y="538" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#6366F1" font-weight="500">.mcp.json</text>
<rect x="678" y="518" width="158" height="30" rx="7" fill="#1B122B"/><text x="690" y="538" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#A4A098" font-weight="500">~/.claude.json</text>
<text x="560" y="602" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#FCD34D">Shared on clone -&gt; project file; secrets via</text>
<text x="560" y="620" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#FCD34D">${ENV_VAR}.</text>
<rect x="36" y="660" width="619" height="207" rx="14" fill="#160F24" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
<text x="52" y="687" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#A855F7" font-weight="600">05</text>
<text x="52" y="717" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#F3F3F1" font-weight="650">CLAUDE.md</text>
<text x="52" y="752" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">~/.claude/ personal; project .claude/CLAUDE.md</text>
<text x="52" y="771" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">or root shared.</text>
<rect x="52" y="783" width="123" height="26" rx="6" fill="rgba(168,85,247,.18)"/><text x="63" y="801" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#A855F7" font-weight="500">team=project</text>
<rect x="182" y="783" width="89" height="26" rx="6" fill="#1B122B"/><text x="193" y="801" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#A4A098" font-weight="500">personal</text>
<text x="52" y="837" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#FCD34D">Team standards live in project CLAUDE.md, not</text>
<text x="52" y="853" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#FCD34D">user-level.</text>
<rect x="677" y="666" width="487" height="207" rx="14" fill="#160F24" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
<text x="693" y="693" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#A855F7" font-weight="600">06</text>
<text x="693" y="723" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#F3F3F1" font-weight="650">CLI CI</text>
<text x="693" y="758" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">-p / --print non-interactive;</text>
<text x="693" y="777" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">--output-format json.</text>
<rect x="693" y="789" width="106" height="26" rx="6" fill="rgba(252,211,77,.15)"/><text x="704" y="807" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#FCD34D" font-weight="500">-p/--print</text>
<rect x="806" y="789" width="114" height="26" rx="6" fill="#1B122B"/><text x="817" y="807" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#A4A098" font-weight="500">json schema</text>
<text x="693" y="843" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#FCD34D">Reject invented flags like CLAUDE_HEADLESS</text>
<text x="693" y="859" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#FCD34D">or --batch.</text>
<rect x="36" y="889" width="486" height="208" rx="14" fill="#160F24" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
<text x="52" y="916" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#A855F7" font-weight="600">07</text>
<text x="52" y="946" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#F3F3F1" font-weight="650">Grep vs Glob</text>
<text x="52" y="981" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">Grep searches contents; Glob matches</text>
<text x="52" y="1000" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#D4D2CE">path patterns.</text>
<rect x="52" y="1012" width="131" height="26" rx="6" fill="rgba(99,102,241,.18)"/><text x="63" y="1030" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#6366F1" font-weight="500">Grep=contents</text>
<rect x="190" y="1012" width="106" height="26" rx="6" fill="rgba(168,85,247,.18)"/><text x="201" y="1030" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#A855F7" font-weight="500">Glob=paths</text>
<text x="52" y="1067" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#FCD34D">Incremental explore: Grep -&gt; Read matches.</text>
<text x="52" y="1083" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#FCD34D">Never Read-all.</text>
<rect x="544" y="885" width="620" height="208" rx="14" fill="#160F24" stroke="rgba(243,243,241,.12)" stroke-width="1"/>
<text x="560" y="913" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#A855F7" font-weight="600">08</text>
<text x="560" y="945" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="24" fill="#F3F3F1" font-weight="650">Batches vs sync</text>
<text x="560" y="984" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#D4D2CE">Batches ~50% cheaper, up to 24h; no</text>
<text x="560" y="1005" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#D4D2CE">multi-turn tools.</text>
<rect x="560" y="1019" width="139" height="30" rx="7" fill="rgba(252,211,77,.15)"/><text x="572" y="1039" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#FCD34D" font-weight="500">~50% cheaper</text>
<rect x="707" y="1019" width="177" height="30" rx="7" fill="rgba(168,85,247,.18)"/><text x="719" y="1039" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#A855F7" font-weight="500">sync if blocking</text>
<text x="560" y="1079" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#FCD34D">Blocking / pre-merge -&gt; sync Messages API.</text>

